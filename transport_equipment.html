<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport Equipment: Scaling Fast, on Firmer Footing — Sector Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS — change palette / type here, nowhere else
     ============================================================ */
  :root{
    --ink:#181611;              /* primary text */
    --card:#e9e1cd;            /* canvas background, unbleached cotton */
    --paper:#f2ede1;             /* node card background */
    --thread-indigo:#26344a;    /* indigo dye — structure */
    --thread-madder:#9a2b1f;    /* madder red — performance/trade */
    --thread-turmeric:#b8842a;  /* turmeric — investment/geography */
    --thread-teal:#3c6a5f;      /* teal — clusters/story */
    --maroon:#9a2b1f;           /* deep maroon — chart axes & emphasis */
    --maroon-soft:#b8483a;      /* lighter maroon for secondary marks */
    --line-soft: rgba(24,22,17,0.14);
    --line-strong: rgba(24,22,17,0.5);
    --display: 'Fraunces', serif;
    --body: 'Inter', sans-serif;
    --mono: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--body);}

  /* ============================================================
     STAGE — the viewport-height window onto the canvas.
     Sits in normal document flow; the Sector Story lives below it
     in ordinary scroll, not inside the zoom canvas.
     ============================================================ */
  #stage{position:relative;width:100%;height:100vh;overflow:hidden;cursor:grab;
    background:
      radial-gradient(circle at 20% 15%, rgba(43,58,85,0.07), transparent 42%),
      radial-gradient(circle at 82% 12%, rgba(192,138,46,0.06), transparent 38%),
      radial-gradient(circle at 80% 88%, rgba(163,64,47,0.07), transparent 42%),
      radial-gradient(circle at 12% 85%, rgba(60,110,100,0.06), transparent 40%),
      repeating-linear-gradient(45deg, rgba(32,34,31,0.025) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(-45deg, rgba(32,34,31,0.025) 0 1px, transparent 1px 26px),
      var(--paper);
  }
  #stage.dragging{cursor:grabbing;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;transition:transform 900ms cubic-bezier(.16,.84,.44,1);}

  #threads{position:absolute;top:0;left:0;pointer-events:none;}

  /* ============================================================
     NODE CARDS
     ============================================================ */
  .node{position:absolute;background:var(--card);border:1px solid var(--line-strong);border-radius:2px;
    box-shadow:0 6px 16px -10px rgba(24,22,17,0.28);overflow:hidden;transition:box-shadow 260ms ease,transform 260ms ease,border-color 260ms ease;}
  .node:not(.center):hover{box-shadow:0 10px 24px -12px rgba(24,22,17,0.35);border-color:var(--ink);transform:translateY(-4px);}
  .node.center{box-shadow:0 0 0 6px rgba(24,22,17,0.05),0 10px 28px -14px rgba(24,22,17,0.35);}
  .node.center{border-color:var(--ink);border-width:2px;}
  .node-hit{position:absolute;inset:0;cursor:pointer;z-index:5;}
  .node.active .node-hit{display:none;}
  .node.active{cursor:default;}

  .eyebrow{font-family:var(--mono);font-size:16px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin:0 0 6px;}
  .node h1{font-family:var(--display);font-weight:600;margin:0 0 10px;line-height:1.05;}
  .node .kicker-num{font-family:var(--mono);font-size:14px;opacity:.5;}

  /* ---------------------------------------------------------
     CENTER COVER — mirrors the satellite covers: big, bold,
     legible from across the whole shrunk-down bird's-eye view.
     The full preview (title/tagline/stats) only appears once
     the center node is active (i.e. actually zoomed into).
     --------------------------------------------------------- */
  .center-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:40px;background:var(--card);opacity:1;
    transition:opacity 420ms ease;}
  .center-cover .cc-eyebrow{font-family:var(--mono);font-size:22px;letter-spacing:.06em;text-transform:uppercase;
    opacity:.55;margin:0 0 18px;}
  .center-cover .cc-title{font-family:var(--display);font-weight:700;font-size:118px;line-height:1;margin:0;color:var(--ink);}
  .center-cover .cc-cta{margin-top:44px;display:inline-flex;align-items:center;gap:14px;background:var(--ink);
    color:var(--card);font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:.01em;padding:24px 56px;
    border-radius:2px;animation:badge-pulse 2.2s ease-in-out infinite;
    box-shadow:0 0 0 1px rgba(24,22,17,0.12);}
  @keyframes badge-pulse{0%,100%{opacity:1;transform:translateY(0);}50%{opacity:.8;transform:translateY(-6px);}
  .node.center.active .center-cover{opacity:0;pointer-events:none;}

  /* central node content */
  .preview{position:absolute;inset:0;padding:56px 60px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity 420ms ease 80ms;}
  .node.center.active .preview{opacity:1;pointer-events:auto;}
  .preview h1{font-size:76px;}
  .preview .tagline{font-size:22px;max-width:640px;opacity:.75;margin-top:6px;}
  .preview .stat-row{display:flex;gap:44px;margin-top:26px;justify-content:center;flex-wrap:wrap;}
  .preview .stat{font-family:var(--mono);}
  .preview .stat .n{font-size:34px;font-weight:600;display:block;}
  .preview .stat .l{font-size:14px;opacity:.6;}
  .cta-btn{margin-top:34px;background:var(--thread-indigo);color:var(--card);border:none;border-radius:2px;
    padding:14px 28px;font-family:var(--mono);font-size:14px;letter-spacing:.05em;cursor:pointer;
    box-shadow:none;}
  .cta-btn:hover{background:#1c273b;}

  /* ---------------------------------------------------------
     COVER — what a satellite shows at bird's-eye view. Plain,
     legible from a distance: number + theme name, nothing else.
     --------------------------------------------------------- */
  .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;background:var(--card);opacity:1;transition:opacity 420ms ease;}
  .cover::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;background:var(--accent);}
  .cover::after{content:"";position:absolute;top:26px;right:26px;width:14px;height:14px;border-radius:50%;
    background:var(--accent);opacity:.5;}
  /* Sized large on purpose: the overview shows the whole ring scaled down to fit the
     screen, so these need to survive that shrink and still read clearly at a glance. */
  .cover-num{font-family:var(--display);font-weight:700;font-size:130px;line-height:1;color:var(--accent);margin-bottom:16px;}
  .cover-label{font-family:var(--display);font-weight:600;font-size:70px;line-height:1.16;max-width:900px;margin:0;}
  .cover-arrow{margin-top:38px;font-family:var(--mono);font-size:28px;opacity:.42;}
  .node.active .cover{opacity:0;pointer-events:none;}

  /* ---------------------------------------------------------
     DETAIL — full content, revealed once a node is active.
     Scrolls internally if content runs long; the box itself
     stays a fixed, sane height rather than growing forever.
     --------------------------------------------------------- */
  .detail-wrap{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 420ms ease 80ms;}
  .node.active .detail-wrap{opacity:1;pointer-events:auto;}
  .detail-wrap::-webkit-scrollbar{width:9px;}
  .detail-wrap::-webkit-scrollbar-thumb{background:var(--line-soft);border-radius:8px;}
  .detail-wrap::-webkit-scrollbar-thumb:hover{background:var(--line-strong);}

  .detail{padding:68px 76px 8px;}
  .detail .theme-label{font-family:var(--mono);font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;}
  .detail h2{font-family:var(--display);font-weight:600;font-size:50px;margin:8px 0 14px;line-height:1.08;}
  .detail .subhead{font-size:21px;line-height:1.6;opacity:.8;max-width:840px;margin-bottom:46px;}
  .detail .grid2{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-bottom:52px;align-items:start;}
  .detail .grid1{margin-bottom:52px;}
  .block-title{font-family:var(--display);font-size:25px;font-weight:600;margin:0 0 10px;}
  .block-note{font-size:16px;line-height:1.55;opacity:.72;margin:0 0 18px;max-width:760px;}
  .block-note-wide{font-size:17px;line-height:1.68;opacity:.78;margin:0 0 18px;max-width:1040px;}
  .flag{background:rgba(154,43,31,0.08);border-left:3px solid var(--thread-madder);padding:20px 24px;
    font-size:17px;line-height:1.6;margin:16px 0 0;border-radius:0;}
  .flag b{color:var(--thread-madder);}

  .insight-box{border-left:3px solid var(--thread-turmeric);padding:18px 22px;margin:16px 0 0;
    background:rgba(184,132,42,0.08);border-radius:0;}
  .insight-box .label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--thread-turmeric);font-weight:600;margin-bottom:6px;}
  .insight-box p{margin:0;font-size:16px;line-height:1.55;font-family:var(--display);color:var(--ink);}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:0;padding:20px 22px 6px;}
  table{border-collapse:collapse;width:100%;font-size:16px;min-width:420px;}
  th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:16px;
    white-space:normal;vertical-align:top;}
  thead th{border-bottom:2px solid var(--ink);}
  th{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.04em;opacity:.7;font-weight:600;white-space:normal;line-height:1.35;}
  td.num,th.num{text-align:right;font-family:var(--mono);} 
  td.num{white-space:nowrap;}
  tr:last-child td{border-bottom:none;}

  .chip-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
  .chip{background:rgba(24,22,17,.05);border:1px solid var(--line-strong);border-radius:2px;padding:9px 18px;font-size:15px;}

  .narrative{font-family:var(--display);font-size:20px;line-height:1.75;max-width:900px;}
  .narrative p{margin:0 0 18px;}

  /* footer nav inside each satellite's scrollable detail */
  .detail-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    padding:26px 76px 44px;border-top:1px solid var(--line-soft);margin-top:8px;}
  .nav-btn{background:none;border:1px solid var(--line-strong);border-radius:2px;padding:11px 20px;
    font-family:var(--mono);font-size:13px;letter-spacing:.02em;cursor:pointer;color:var(--ink);}
  .nav-btn:hover{border-color:var(--line-strong);}
  .nav-btn.primary{background:var(--thread-indigo);color:var(--card);border-color:var(--thread-indigo);}
  .nav-btn.primary:hover{background:#1c273b;}

  /* ============================================================
     CHARTS — prominent, maroon-framed axes with clearly legible
     labels. Tick labels are fully opaque and sized up; axis
     lines and axis titles use deep maroon for emphasis.
     ============================================================ */
  .chart-frame{background:var(--paper);border-top:3px solid var(--ink);border-bottom:1.5px solid var(--ink);
    border-left:none;border-right:none;border-radius:0;padding:22px 14px 16px;}
  svg text{font-family:var(--mono);fill:var(--ink);font-size:19px;}
  .axis-line{stroke:var(--maroon);stroke-width:3.2;opacity:1;}
  .axis-tick{stroke:var(--maroon);stroke-width:2.6;opacity:1;}
  .grid-line{stroke:rgba(32,34,31,0.22);stroke-width:1.3;opacity:.8;}
  .axis-label{font-size:19px;opacity:1;font-weight:600;fill:var(--maroon);letter-spacing:.01em;}
  .tick-label{font-size:18px;opacity:1;font-weight:500;fill:var(--ink);letter-spacing:0;}
  .chart-title{font-family:var(--display);font-size:26px;font-weight:600;fill:var(--ink);}
  .legend-label{font-size:18px;opacity:1;font-weight:500;fill:var(--ink);}
  .anno-text{font-size:17px;font-weight:700;fill:var(--thread-turmeric);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;}
  .anno-text.down{fill:var(--thread-madder);}
  .anno-text.latest{fill:var(--thread-indigo);}
  .value-label{font-size:16px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;}
  /* ============================================================
     HUD — controls (fixed over the stage, fades once you scroll
     past it into the Sector Story)
     ============================================================ */
  #hud{position:fixed;top:62px;left:32px;right:32px;z-index:50;display:flex;align-items:center;
    justify-content:space-between;gap:16px;font-family:var(--mono);transition:opacity 300ms ease;}
  #hud-left{display:flex;align-items:center;gap:16px;min-width:0;}
  #hud-right{display:flex;align-items:center;gap:10px;}
  .hud-btn{background:var(--thread-indigo);color:var(--card);border:none;border-radius:30px;padding:11px 22px;
    font-family:var(--mono);font-size:14px;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;
    gap:8px;box-shadow:0 8px 20px -8px rgba(43,58,85,.6);}
  .hud-btn:hover{background:#1c273b;}
  .hud-btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-soft);box-shadow:none;}
  .hud-btn.ghost:hover{border-color:var(--line-strong);}
  .hidden{display:none !important;}
  #breadcrumb{font-size:14px;opacity:.65;letter-spacing:.03em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:38vw;}
  #breadcrumb b{opacity:1;color:var(--thread-madder);}

  #bottom-bar{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:50;
    display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity 300ms ease;}
  #bottom-bar.hidden{opacity:0;pointer-events:none;}
  #hint{font-family:var(--mono);font-size:13px;opacity:.5;letter-spacing:.02em;pointer-events:none;text-align:center;}
  #scroll-cta{background:var(--card);border:1px solid var(--line-soft);border-radius:24px;padding:10px 20px;
    font-family:var(--mono);font-size:13px;letter-spacing:.03em;cursor:pointer;color:var(--ink);
    box-shadow:0 10px 24px -12px rgba(32,34,31,0.4);}
  #scroll-cta:hover{border-color:var(--line-strong);}
    .faded{opacity:0;pointer-events:none;}

  /* ============================================================
     TOP STRIP — static dateline-style bar above the stage, in
     normal document flow (scrolls away, not fixed). Carries the
     sector name and byline, newspaper masthead style.
     ============================================================ */
  #top-strip{background:var(--paper);border-bottom:1px solid var(--rule-soft,var(--line-strong));
    padding:20px 32px;display:flex;align-items:baseline;justify-content:flex-start;gap:22px;flex-wrap:wrap;
    font-family:var(--mono);}
  #top-strip .ts-name{font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
    font-family:var(--display);}
  #top-strip .ts-byline{font-size:14px;letter-spacing:.03em;text-transform:uppercase;opacity:.62;}
  #top-strip .ts-byline b{opacity:1;font-weight:600;color:var(--maroon);}

  /* ============================================================
     ZOOM RAIL — fixed + / − controls on the right edge of the stage.
     Fades together with the HUD once you scroll into the story.
     ============================================================ */
  #zoom-rail{position:fixed;top:50%;right:22px;transform:translateY(-50%);z-index:50;
    display:flex;flex-direction:column;gap:8px;transition:opacity 300ms ease;}
  #zoom-rail.faded{opacity:0;pointer-events:none;}
  .zoom-btn{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line-soft);
    color:var(--ink);font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -10px rgba(32,34,31,0.4);
    transition:background 180ms ease,border-color 180ms ease,transform 160ms ease;}
  .zoom-btn:hover{border-color:var(--maroon);color:var(--maroon);transform:scale(1.06);}
  .zoom-btn:active{transform:scale(.96);}
  .zoom-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;border-color:var(--line-soft);color:var(--ink);}
  #zoom-level{font-family:var(--mono);font-size:11px;opacity:.6;text-align:center;margin-top:2px;letter-spacing:.02em;}

  /* ============================================================
     SECTOR STORY — ordinary page content below the canvas, meant
     to be read by anyone regardless of whether they click through
     the mindmap.
     ============================================================ */
  #story-section{max-width:760px;margin:0 auto;padding:110px 24px 160px;}
    .back-to-top{display:inline-block;margin-bottom:44px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;
    opacity:.5;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line-soft);padding-bottom:2px;}
  .back-to-top:hover{opacity:1;}
  .story-divider{display:none;}

  /* ---- masthead-style article header ---- */
  .story-dateline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);opacity:.6;padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:26px;}
  .story-dateline .mid{color:var(--maroon);opacity:1;}

  .story-eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:13px;opacity:.55;
    text-align:center;margin:0 0 14px;}
  .story-title{font-family:var(--display);font-weight:800;font-size:clamp(32px,5.4vw,58px);text-align:center;
    margin:0 0 20px;line-height:1.05;letter-spacing:-0.01em;}
  .story-byline{text-align:center;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink);opacity:.7;margin:0 0 6px;}
  .story-byline b{color:var(--maroon);opacity:1;}
  .story-dek{text-align:center;font-family:var(--body);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    opacity:.45;margin:0 0 40px;}
  .story-rule{max-width:100%;border:none;border-top:3px solid var(--ink);margin:0 0 8px;}
  .story-rule.thin{border-top:1px solid var(--line-strong);margin:0 0 40px;}

  .story-lede{font-family:var(--display);font-size:20px;line-height:1.6;text-align:left;opacity:.85;
    max-width:680px;margin:0 auto 56px;font-style:italic;}
  .story-lede .dropcap{float:left;font-family:var(--display);font-weight:700;font-style:normal;font-size:66px;
    line-height:0.8;padding:5px 10px 0 0;color:var(--ink);}

  .story-block{margin-bottom:44px;}
  .story-block h3{font-family:var(--body);font-size:20px;font-weight:700;margin:0 0 16px;color:var(--ink);
    text-transform:uppercase;letter-spacing:.08em;
    display:flex;align-items:center;gap:12px;}
  .story-block h3::after{content:"";flex:1;height:1px;background:var(--rule,var(--ink));opacity:.25;}
  .story-block p{font-family:var(--display);font-size:18px;line-height:1.78;margin:0 0 16px;color:var(--ink);
    text-align:justify;text-justify:inter-word;}
  .story-block p:first-of-type::first-letter{font-weight:600;}
  .story-takeaway{margin-top:56px;padding:30px 34px;border-left:3px solid var(--thread-madder);
    background:rgba(163,64,47,.07);border-radius:0 6px 6px 0;font-family:var(--display);font-size:19px;line-height:1.65;}
  .story-takeaway b{color:var(--thread-madder);}

  /* summary stat grid */
  .summary-grid{display:flex;flex-wrap:wrap;gap:24px 36px;margin:32px 0 12px;padding-top:20px;border-top:1px solid var(--line-soft);}
  .summary-grid > div{flex:1 1 120px;min-width:110px;}
  .summary-grid .num{font-family:var(--mono);font-weight:600;font-size:1.3rem;color:var(--thread-indigo);display:block;line-height:1.15;}
  .summary-grid .lbl{font-family:var(--mono);font-size:10px;color:var(--ink);opacity:.6;text-transform:uppercase;letter-spacing:.02em;margin-top:7px;display:block;line-height:1.35;}

  /* R&D callout block */
  .rnd-callout{background:rgba(43,58,85,0.06);border:1.5px solid rgba(43,58,85,0.18);border-radius:10px;padding:28px 26px 22px;}
  .rnd-num{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--thread-indigo);margin-bottom:6px;}
  .rnd-label{font-family:var(--body);font-size:16px;opacity:.75;margin-bottom:18px;}
  .rnd-bands{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .rnd-band{font-family:var(--body);font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line-soft);opacity:.5;}
  .rnd-band.active{opacity:1;background:rgba(163,64,47,0.12);border-color:var(--thread-madder);color:var(--thread-madder);font-weight:600;}
  .rnd-active{}
  .rnd-leader{}
  .rnd-note{font-family:var(--body);font-size:15px;line-height:1.6;opacity:.75;margin:0;}

  /* Trade KPI cards */
  .trade-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px;}
  .trade-kpi{background:rgba(43,58,85,0.05);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;}
  .trade-kpi-n{font-family:var(--display);font-weight:700;font-size:26px;color:var(--thread-indigo);display:block;line-height:1.1;}
  .trade-kpi-l{font-family:var(--body);font-size:13px;opacity:.7;letter-spacing:.01em;margin-top:6px;display:block;line-height:1.4;}

  /* references / notes / colophon */
  .story-footer{margin-top:64px;padding-top:28px;border-top:2px solid var(--ink);}
  .story-footer h4{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--maroon);margin:0 0 12px;font-weight:700;}

/* =====================================================================
   CHART HELPERS
   ===================================================================== */
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const n=v/p;
  const step = n<=1?1:n<=2?2:n<=5?5:10; return step*p; }

function svgAxes(x0,y0,x1,y1,maxVal,minVal,xLabel,yLabel,title,w,h){
  let s = `<line class="axis-line" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`;
  s += `<line class="axis-line" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`;
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const val = minVal + (maxVal-minVal)*i/ticks;
    const y = y0 - (y0-y1)*i/ticks;
    s += `<line class="grid-line" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
    s += `<line class="axis-tick" x1="${x0-7}" y1="${y}" x2="${x0}" y2="${y}"/>`;
    s += `<text class="tick-label" x="${x0-12}" y="${y+5}" text-anchor="end">${fmtShort(val)}</text>`;
  }
  s += `<text class="axis-label" x="${(x0+x1)/2}" y="${y0+50}" text-anchor="middle">${xLabel}</text>`;
  s += `<text class="axis-label" transform="translate(${x0-62},${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${yLabel}</text>`;
  s += `<text class="chart-title" x="${x0}" y="${y1-22}">${title}</text>`;
  return s;
}
function fmtShort(v){
  if(Math.abs(v)>=100000) return (v/100000).toFixed(1)+"L";
  if(Math.abs(v)>=1000) return (v/1000).toFixed(v>=10000?0:1)+"k";
  return (Math.round(v*100)/100).toString();
}
/* Value labels on bars/points must stay compact but exact-ish; short-form
   for big absolute figures, one-decimal for anything under 1000. */
function fmtVal(v){
  if(Math.abs(v)>=1000) return fmtShort(v);
  if(Number.isInteger(v)) return v.toString();
  return (Math.round(v*100)/100).toString();
}

function lineChart(cfg){
  const w=1000,h=440, x0=92,y1=40,y0=h-70,x1=w-40;
  const allVals = cfg.series ? cfg.series.flatMap(s=>s.values) : cfg.values;
  let maxVal = Math.max(...allVals), minVal = Math.min(0,Math.min(...allVals));
  maxVal = niceMax(maxVal*1.15);
  if(minVal<0) minVal = -niceMax(-minVal*1.15);
  const labels = cfg.labels;
  const xStep = (x1-x0)/(labels.length-1);
  const yFor = v => y0 - (y0-y1)*((v-minVal)/(maxVal-minVal));
  let s = `<div class="chart-frame"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  s += svgAxes(x0,y0,x1,y1,maxVal,minVal,cfg.xLabel,cfg.yLabel,cfg.title,w,h);
  labels.forEach((l,i)=>{ s+=`<line class="axis-tick" x1="${x0+i*xStep}" y1="${y0}" x2="${x0+i*xStep}" y2="${y0+7}"/>`;
    s+=`<text class="tick-label" x="${x0+i*xStep}" y="${y0+24}" text-anchor="middle">${l}</text>`; });
  const series = cfg.series || [{name:null,color:"var(--thread-indigo)",values:cfg.values}];
  const multi = series.length>1;
  series.forEach((ser,si)=>{
    let path="";
    ser.values.forEach((v,i)=>{ const x=x0+i*xStep, y=yFor(v); path+= (i===0?"M":"L")+x+","+y+" "; });
    s+=`<path d="${path}" fill="none" stroke="${ser.color}" stroke-width="3"/>`;
    ser.values.forEach((v,i)=>{ const x=x0+i*xStep, y=yFor(v);
      s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${ser.color}"/>`;
      const above = multi ? (si%2===0) : true;
      const ly = above ? y-12 : y+20;
      s+=`<text class="value-label" x="${x}" y="${ly}" text-anchor="middle" fill="${ser.color}">${fmtVal(v)}</text>`;
    });
  });
  if(cfg.annotations){
    cfg.annotations.forEach(a=>{
      const x=x0+a.index*xStep, y=yFor(cfg.values[a.index]);
      s+=`<circle cx="${x}" cy="${y}" r="6" fill="${a.color}" stroke="var(--card)" stroke-width="2"/>`;
      s+=`<text class="anno-text ${a.color=== 'var(--thread-madder)' ? 'down' : a.color==='var(--thread-indigo)' ? 'latest' : ''}" x="${x+10}" y="${y-10}">${a.label}</text>`;
    });
  }
  if(cfg.series){
    let lx=x1-220, ly=y1+8;
    cfg.series.forEach((ser,i)=>{
      s+=`<rect x="${lx}" y="${ly+i*24-9}" width="14" height="14" fill="${ser.color}"/>`;
      s+=`<text class="legend-label" x="${lx+20}" y="${ly+i*24+2}">${ser.name}</text>`;
    });
  }
  s+="</svg></div>";
  return s;
}

function barLineChart(cfg){
  /* Dual-axis: bars on left Y (GVO), line on right Y (GVA%) so the
     line occupies the full chart height instead of sitting near 0. */
  const w=1160,h=560, x0=118,y1=70,y0=h-100,x1=w-100;
  const barVals=cfg.barValues, lineVals=cfg.lineValues;
  let maxBar = niceMax(Math.max(...barVals)*1.38);
  const minLine = Math.min(...lineVals)*0.9;
  const maxLine = Math.max(...lineVals)*1.15;
  const labels = cfg.labels;
  const xStep = (x1-x0)/(labels.length-1);
  const bw = xStep*0.5;
  const xPad = Math.max(26, bw*0.55);
  const xAt = i => x0 + xPad + i*((x1-x0-2*xPad)/(labels.length-1));
  const yBarFor = v => y0 - (y0-y1)*(v/maxBar);
  const yLineFor = v => y0 - (y0-y1)*((v-minLine)/(maxLine-minLine));
  const HALO = 'paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;';
  let s = `<div class="chart-frame"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  /* title */
  s += `<text class="chart-title" x="${x0}" y="${y1-30}">${cfg.title}</text>`;
  /* left axis (bars) */
  s += `<line class="axis-line" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`;
  s += `<line class="axis-line" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`;
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const val=maxBar*i/ticks, y=y0-(y0-y1)*i/ticks;
    s+=`<line class="grid-line" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
    s+=`<line class="axis-tick" x1="${x0-7}" y1="${y}" x2="${x0}" y2="${y}"/>`;
    s+=`<text class="tick-label" x="${x0-12}" y="${y+5}" text-anchor="end">${fmtShort(val)}</text>`;
  }
  s+=`<text class="axis-label" transform="translate(${x0-86},${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${cfg.yLabel}</text>`;
  s+=`<text class="axis-label" x="${(x0+x1)/2}" y="${y0+58}" text-anchor="middle">${cfg.xLabel}</text>`;
  /* right axis (line) */
  s += `<line class="axis-line" x1="${x1}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;
  for(let i=0;i<=ticks;i++){
    const val=minLine+(maxLine-minLine)*i/ticks, y=y0-(y0-y1)*i/ticks;
    s+=`<line class="axis-tick" x1="${x1}" y1="${y}" x2="${x1+7}" y2="${y}"/>`;
    s+=`<text class="tick-label" x="${x1+12}" y="${y+5}" text-anchor="start">${val.toFixed(1)}%</text>`;
  }
  s+=`<text class="axis-label" transform="translate(${x1+88},${(y0+y1)/2}) rotate(90)" text-anchor="middle" fill="var(--thread-turmeric)">${cfg.lineLabel}</text>`;
  /* x ticks */
  labels.forEach((l,i)=>{
    const x = xAt(i);
    s+=`<line class="axis-tick" x1="${x}" y1="${y0}" x2="${x}" y2="${y0+7}"/>`;
    s+=`<text class="tick-label" x="${x}" y="${y0+26}" text-anchor="middle">${l}</text>`;
  });
  /* bars + value labels (light-halo behind dark maroon text so it never sits dark-on-dark) */
  barVals.forEach((v,i)=>{
    const cx=xAt(i), y=yBarFor(v);
    s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${y0-y}" fill="var(--maroon)" rx="2" opacity="0.85"/>`;
    s+=`<text class="value-label" x="${cx}" y="${y-14}" text-anchor="middle" fill="var(--maroon)" style="${HALO}">${v}</text>`;
  });
  /* line + value labels - anchor shifts inward at the two edges so labels
     never overlap the y-axis tick column or spill past the right edge */
  let lpath="";
  lineVals.forEach((v,i)=>{ const x=xAt(i), y=yLineFor(v); lpath+=(i===0?"M":"L")+x+","+y+" "; });
  s+=`<path d="${lpath}" fill="none" stroke="var(--thread-turmeric)" stroke-width="3.6"/>`;
  lineVals.forEach((v,i)=>{
    const x=xAt(i), y=yLineFor(v);
    const anchor = i===0 ? "start" : (i===lineVals.length-1 ? "end" : "middle");
    const lx = i===0 ? x+10 : (i===lineVals.length-1 ? x-10 : x);
    s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="var(--thread-turmeric)" stroke="var(--paper)" stroke-width="1.8"/>`;
    s+=`<text class="value-label" x="${lx}" y="${y-16}" text-anchor="${anchor}" fill="var(--thread-turmeric)" style="${HALO}">${v.toFixed(1)}%</text>`;
  });
  /* legend */
  let lx=x0+20, ly=y1+16;
  s+=`<rect x="${lx}" y="${ly-10}" width="16" height="16" fill="var(--maroon)" rx="2" opacity="0.85"/>`;
  s+=`<text class="legend-label" x="${lx+24}" y="${ly+3}">GVO (Rs lakh cr)</text>`;
  s+=`<circle cx="${lx+8}" cy="${ly+26}" r="6" fill="var(--thread-turmeric)"/>`;
  s+=`<text class="legend-label" x="${lx+24}" y="${ly+30}">${cfg.lineLabel} (right axis)</text>`;
  s+="</svg></div>";
  return s;
}

function barChart(cfg){
  const w=1000,h=440, x0=92,y1=40,y0=h-70,x1=w-40;
  let maxVal = niceMax(Math.max(...cfg.values)*1.15);
  const labels = cfg.labels;
  const bw = (x1-x0)/labels.length*0.6;
  const step = (x1-x0)/labels.length;
  const yFor = v => y0 - (y0-y1)*(v/maxVal);
  let s = `<div class="chart-frame"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  s += svgAxes(x0,y0,x1,y1,maxVal,0,cfg.xLabel,cfg.yLabel,cfg.title,w,h);
  cfg.values.forEach((v,i)=>{
    const cx = x0 + step*i + step/2;
    const y = yFor(v);
    s += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${y0-y}" fill="var(--maroon)" rx="2"/>`;
    s += `<text class="bar-value-label" x="${cx}" y="${y-10}" text-anchor="middle">${fmtVal(v)}${cfg.valueSuffix||''}</text>`;
    s += `<line class="axis-tick" x1="${cx}" y1="${y0}" x2="${cx}" y2="${y0+7}"/>`;
    s += `<text class="tick-label" x="${cx}" y="${y0+24}" text-anchor="middle">${labels[i]}</text>`;
  });
  s+="</svg></div>";
  return s;
}

function pieChart(cfg){
  const w=1000,h=460, cx=300, cy=230, r=160;
  const total = cfg.values.reduce((a,b)=>a+b, 0);
  const palette = ["var(--thread-indigo)","var(--thread-madder)","var(--thread-teal)","var(--thread-turmeric)"];
  let s = `<div class="chart-frame"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  s += `<text class="chart-title" x="20" y="28">${cfg.title}</text>`;
  let angle = -90;
  cfg.values.forEach((v,i)=>{
    const pct = v/total;
    const sweep = pct*360;
    const a1 = (angle)*Math.PI/180;
    const a2 = (angle+sweep)*Math.PI/180;
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
    const large = sweep > 180 ? 1 : 0;
    s += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${palette[i%palette.length]}" opacity="0.85" stroke="var(--card)" stroke-width="2"/>`;
    const midA = (angle+sweep/2)*Math.PI/180;
    const lx = cx + (r*0.62)*Math.cos(midA), ly = cy + (r*0.62)*Math.sin(midA);
    const pctStr = (pct*100).toFixed(1) + "%";
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" style="font-family:var(--mono);font-size:15px;font-weight:600;fill:var(--card);">${pctStr}</text>`;
    angle += sweep;
  });
  let ly = 60;
  cfg.labels.forEach((l,i)=>{
    const v = cfg.values[i];
    const pct = (v/total*100).toFixed(1);
    s += `<rect x="560" y="${ly-12}" width="16" height="16" fill="${palette[i%palette.length]}" rx="2"/>`;
    s += `<text class="legend-label" x="584" y="${ly}" dominant-baseline="central">${l}</text>`;
    s += `<text class="tick-label" x="960" y="${ly}" text-anchor="end" dominant-baseline="central" style="font-weight:600;">${pct}%</text>`;
    ly += 38;
  });
  s += `</svg></div>`;
  return s;
}

function isNumericCell(v){
  const s = String(v==null?"":v).trim();
  if(s==="" || s==="—" || s==="-" || /^n\/a$/i.test(s)) return true;
  return /^[₹#~\-−+]?[\d]/.test(s);
}
function table(cfg){
  // A column only gets the numeric (mono, right-aligned) treatment if every
  // cell in it actually looks like a number/currency value — otherwise it's
  // treated as ordinary text (readable body font, left-aligned, free to wrap).
  const numCol = cfg.cols.map((c,i)=> i>0 && cfg.rows.every(r=>isNumericCell(r[i])) );
  let s = `<div class="table-scroll"><p class="block-note">${cfg.note}</p><table><thead><tr>`;
  cfg.cols.forEach((c,i)=>{ s+=`<th class="${numCol[i]?'num':''}">${c}</th>`; });
  s+="</tr></thead><tbody>";
  cfg.rows.forEach(r=>{ s+="<tr>"+r.map((c,i)=>`<td class="${numCol[i]?'num':''}">${c}</td>`).join("")+"</tr>"; });
  s+="</tbody></table></div>";
  return s;
}

function polar(angleDeg, rx, ry){
  const a = angleDeg*Math.PI/180;
  return {x: Math.cos(a)*rx, y: Math.sin(a)*ry};

function formatCountNum(v, decimals, grouped){
  let s = v.toFixed(decimals);
  if(grouped){
    let parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    s = parts.join(".");
  }
  return s;
}
function animateStatEl(el){
  const final = el.dataset.final;
  const m = final.match(/-?[\d,]+\.?\d*/);
  if(!m){ el.textContent = final; return; }
  const numStr = m[0];
  const prefix = final.slice(0, m.index);
  const suffix = final.slice(m.index + numStr.length);
  const grouped = numStr.includes(",");
  const decimals = numStr.includes(".") ? numStr.split(".")[1].length : 0;
  const finalNum = parseFloat(numStr.replace(/,/g,""));
  const duration = 900;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = prefix + formatCountNum(finalNum*eased, decimals, grouped) + suffix;
    if(t<1) requestAnimationFrame(frame); else el.textContent = final;
  }
  requestAnimationFrame(frame);
}
function animateCenterStats(){
  document.querySelectorAll(".node.center .stat .n").forEach((el,i)=>{
    setTimeout(()=>animateStatEl(el), i*90);
  });
}

/* =====================================================================
   CAMERA
   ===================================================================== */
let current = "overview";
let navIndex = -1;

function applyTransform(cx, cy, scale, animate=true){
  const world = document.getElementById("world");
  const vw = window.innerWidth, vh = window.innerHeight;
  const tx = vw/2 - cx*scale;
  const ty = vh/2 - cy*scale;
  world.style.transition = animate ? "" : "none";
  world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  if(!animate) world.offsetHeight;
  world.style.transition = "";
}

function fitOverview(){
  const allX = Object.values(layout).map(l=>[l.x,l.x+l.w]).flat();
  const allY = Object.values(layout).map(l=>[l.y,l.y+l.h]).flat();
  const minX=Math.min(...allX), maxX=Math.max(...allX);
  const minY=Math.min(...allY), maxY=Math.max(...allY);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const margin = 1.15;
  const scale = Math.min(window.innerWidth/((maxX-minX)*margin), window.innerHeight/((maxY-minY)*margin));
  overviewScale = scale; overviewCenter = {cx,cy};
  applyTransform(cx,cy,scale, current!=="overview");
}
let overviewScale=1, overviewCenter={cx:0,cy:0};

function setActive(key){
  document.querySelectorAll(".node").forEach(n=>n.classList.remove("active"));
  if(!key) return;
  const el = key==="center" ? document.querySelector(".node.center") : document.getElementById("node-"+key);
  if(el) el.classList.add("active");
}

function updateHud(key){
  const home = document.getElementById("home-btn");
  const prev = document.getElementById("prev-btn"), next = document.getElementById("next-btn");
  const crumb = document.getElementById("breadcrumb");
  const bottomBar = document.getElementById("bottom-bar");
  if(key==="overview"){
    home.classList.add("hidden");
    prev.classList.add("hidden"); next.classList.add("hidden");
    crumb.textContent = "";
    bottomBar.classList.remove("hidden");
    return;
  }
  bottomBar.classList.add("hidden");
  home.classList.remove("hidden");
  prev.classList.remove("hidden"); next.classList.remove("hidden");
  if(key==="center"){
    crumb.innerHTML = "<b>Overview</b>";
  } else {
    const orderIdx = ORDER.indexOf(key)+1;
    const shortLabel = DATA[key].eyebrow.split(" — ")[1];
    crumb.innerHTML = `<b>${shortLabel} · ${orderIdx} of ${ORDER.length}</b>`;
  }
}

function currentTransform(){
  const m = new DOMMatrixReadOnly(getComputedStyle(document.getElementById("world")).transform);
  return {x:m.e, y:m.f, scale:m.a};
}
function zoomByButton(factor){
  const t = currentTransform();
  const vw=window.innerWidth, vh=window.innerHeight;
  const wx=(vw/2 - t.x)/t.scale, wy=(vh/2 - t.y)/t.scale;
  const ns=Math.max(0.12, Math.min(t.scale*factor, 3.2));
  applyTransform(wx, wy, ns, true);
  updateZoomLevel(ns);
}
function zoomReset(){
  if(current==="overview"){ fitOverview(); }
  else { zoomTo(current); }
  setTimeout(updateZoomLevelFromTransform, 920);
}
function updateZoomLevel(s){
  const el=document.getElementById("zoom-level");
  if(el) el.textContent=Math.round(s*100)+"%";
}
function updateZoomLevelFromTransform(){ updateZoomLevel(currentTransform().scale); }

function zoomTo(key){
  const l = layout[key];
  const targetScale = Math.min(window.innerWidth/(l.w*1.08), window.innerHeight/(l.h*1.08), 1.15);
  applyTransform(l.cx, l.cy, targetScale, true);
  current = key;
  navIndex = NAV_ORDER.indexOf(key);
  setActive(key);
  updateHud(key);
  if(key==="center") animateCenterStats();
  setTimeout(updateZoomLevelFromTransform, 920);
}

function zoomToOverview(){
  applyTransform(overviewCenter.cx, overviewCenter.cy, overviewScale, true);
  current = "overview";
  navIndex = -1;
  setActive(null);
  updateHud("overview");
  setTimeout(updateZoomLevelFromTransform, 920);
}

function goNext(){
  if(navIndex >= NAV_ORDER.length-1){ zoomToOverview(); scrollToStory(); return; }
  zoomTo(NAV_ORDER[navIndex+1]);
}
function goPrev(){
  if(navIndex<=0){ zoomToOverview(); return; }
  zoomTo(NAV_ORDER[navIndex-1]);
}
function scrollToStory(){
  document.getElementById("story-section").scrollIntoView({behavior:"smooth"});
}

window.addEventListener("keydown", e=>{
  if(document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight") goNext();
  else if(e.key==="ArrowLeft") goPrev();
  else if(e.key==="Escape") zoomToOverview();
});

window.addEventListener("scroll", ()=>{
  const past = window.scrollY > window.innerHeight*0.4;
  document.getElementById("hud").classList.toggle("faded", past);
  document.getElementById("bottom-bar").classList.toggle("faded", past);
});

(function enablePanZoom(){
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  let dragging=false, sx=0, sy=0, startTransform=null;

  stage.addEventListener("mousedown", e=>{
    if(e.target.closest(".node-hit")) return;
    dragging=true; stage.classList.add("dragging");
    sx=e.clientX; sy=e.clientY;
    const m = new DOMMatrixReadOnly(getComputedStyle(world).transform);
    startTransform = {x:m.e, y:m.f, scale:m.a};
    world.style.transition="none";
  });
  window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    world.style.transform = `translate(${startTransform.x+dx}px,${startTransform.y+dy}px) scale(${startTransform.scale})`;
  });
  window.addEventListener("mouseup", ()=>{
    if(!dragging) return;
    dragging=false; stage.classList.remove("dragging");
    world.style.transition="";
  });

  stage.addEventListener("wheel", e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    const t=currentTransform();
    const rect=stage.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const wx=(px-t.x)/t.scale, wy=(py-t.y)/t.scale;
    const factor=Math.exp(-e.deltaY*0.0015);
    const ns=Math.max(0.12, Math.min(t.scale*factor, 3.2));
    world.style.transition="none";
    applyTransform(wx, wy, ns, false);
    updateZoomLevel(ns);
  }, {passive:false});
})();

window.addEventListener("scroll", ()=>{
  const past = window.scrollY > window.innerHeight*0.4;
  document.getElementById("zoom-rail").classList.toggle("faded", past);
});

build();
renderStory();
</script>
